name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main-beta-quests]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main-beta-quests]

permissions:
  contents: read

env:
  WEB_MEDIA_LOCK: deployment/media-releases/combat-d9b7ff1f6eb7.json
  WEB_MEDIA_ORIGIN: https://nexusvergemedia.blob.core.windows.net/media
  WEB_APP_ORIGIN: https://victorious-stone-02afeaa03.2.azurestaticapps.net
  WEB_REQUIRE_TRACKED_APP: '1'

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify legal compliance
        run: npm run legal:verify

      - name: Build the tracked release package
        run: npm run build:web

      - name: Verify published media and production CORS
        run: node scripts/verify-web-media.mjs

      - name: Upload release package for review
        uses: actions/upload-artifact@v4
        with:
          name: web-app-release
          path: dist/app
          if-no-files-found: error
          retention-days: 7

      # PRs validate the same release without deploying a browser origin that
      # the media account's production-only CORS policy does not allow.
      - name: Prepare deployment credentials
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        id: credentials
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_STONE_02AFEAA03 }}
        with:
          script: |
            const token = (process.env.SWA_DEPLOYMENT_TOKEN || '').trim();
            if (!token || /\s/.test(token)) {
              core.setFailed('Azure deployment token is missing or contains embedded whitespace. Check AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_STONE_02AFEAA03.');
              return;
            }
            core.setSecret(token);
            core.setOutput('deployment_token', token);
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            core.setOutput('id_token', idToken);

      - name: Deploy release package and save API
        if: github.event_name == 'push'
        # Pin the maintained v1 branch. The v1 tag resolves to the older action
        # that does not declare github_id_token.
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ steps.credentials.outputs.deployment_token }}
          github_id_token: ${{ steps.credentials.outputs.id_token }}
          action: upload
          app_location: dist/app
          api_location: api
          output_location: ''
          skip_app_build: true
