name: Web delivery package check

on:
  workflow_dispatch:
    inputs:
      media_origin:
        description: HTTPS base URL of the published public-media container or Front Door route
        required: true
        type: string
      media_lock:
        description: Tracked media lock to package
        required: true
        default: deployment/media-releases/combat-d9b7ff1f6eb7.json
        type: string
      app_origin:
        description: SWA origin for media CORS preflight
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run legal:verify
      - name: Build the tracked app against the published media lock
        env:
          WEB_MEDIA_LOCK: ${{ inputs.media_lock }}
          WEB_MEDIA_ORIGIN: ${{ inputs.media_origin }}
          WEB_REQUIRE_TRACKED_APP: '1'
        run: npm run build:web
      - name: Verify media HTTP contract
        env:
          WEB_MEDIA_LOCK: ${{ inputs.media_lock }}
          WEB_MEDIA_ORIGIN: ${{ inputs.media_origin }}
          WEB_APP_ORIGIN: ${{ inputs.app_origin }}
        run: node scripts/verify-web-media.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-app-preview
          path: dist/app
          retention-days: 7
